org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental caches cannot relativize plugin sources when the Windows
# Pub cache and this project are on different drives.
kotlin.incremental=false
# Flutter 3.47 still requires the legacy AGP DSL.
android.newDsl=false
# Keep this explicit so Flutter's migrator does not restore the Kotlin opt-out.
android.builtInKotlin=true
