name: Flutter Release

on:
  push:
    tags:
      - 'flutter-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Flutter release version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version and independent tag
        id: version
        run: python3 flutter/tool/package_android.py validate-version

  checks:
    name: Feature and regression checks
    needs: validate
    uses: ./.github/workflows/flutter-ci.yml

  android:
    name: Android release APKs
    needs: [validate, checks]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: flutter/pubspec.yaml
          cache: true

      - name: Resolve the committed dependency graph
        run: flutter pub get --enforce-lockfile

      - name: Build with the owner-supplied release identity
        shell: bash
        env:
          GITPULSE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gitpulse-release.jks
          KEYSTORE_BASE64: ${{ secrets.FLUTTER_ANDROID_KEYSTORE_BASE64 }}
          GITPULSE_ANDROID_STORE_PASSWORD: ${{ secrets.FLUTTER_ANDROID_STORE_PASSWORD }}
          GITPULSE_ANDROID_KEY_ALIAS: ${{ secrets.FLUTTER_ANDROID_KEY_ALIAS }}
          GITPULSE_ANDROID_KEY_PASSWORD: ${{ secrets.FLUTTER_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.FLUTTER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          # flutter build replaces the Gradle environment with JAVA_HOME and PATH,
          # so the GITPULSE_ANDROID_* variables never reach the signing config.
          python3 tool/package_android.py write-signing
          flutter build apk --release --split-per-abi --no-pub --split-debug-info=build/symbols

      - name: Verify each split APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.FLUTTER_ANDROID_CERT_SHA256 }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: python3 tool/package_android.py verify-splits

      - name: Archive matching Dart debug symbols
        run: python3 tool/package_android.py package-symbols

      - name: Remove the temporary signing key
        if: always()
        shell: bash
        env:
          GITPULSE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gitpulse-release.jks
        run: rm -f -- "$GITPULSE_ANDROID_KEYSTORE_PATH" android/key.properties

      - name: Upload verified Android distribution
        uses: actions/upload-artifact@v7
        with:
          name: gitpulse-flutter-v${{ needs.validate.outputs.version }}-android
          path: |
            flutter/build/distributions/*.apk
            flutter/build/distributions/*-symbols.zip
            flutter/build/distributions/*.sha256
          if-no-files-found: error

  release:
    name: Create draft GitHub Release
    needs: [validate, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: gitpulse-flutter-v${{ needs.validate.outputs.version }}-*
          merge-multiple: true
          path: distributions

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          body="$(mktemp)"
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq .body > "$notes"
          python3 flutter/tool/package_android.py assert-assets \
            --dir distributions \
            --version "$VERSION"
          python3 flutter/tool/flutter_release_notes.py \
            --version "$VERSION" \
            --notes "$notes" \
            --output "$body"
          shopt -s nullglob
          files=(distributions/*)
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "GitPulse Flutter v${VERSION}" \
            --notes-file "$body" \
            --verify-tag \
            "${files[@]}"
