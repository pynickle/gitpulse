[package]
name = "gitpulse_document_svg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Renders document SVG images to pixels for the GitPulse Flutter client."
license = "MIT"

[lib]
name = "gitpulse_document_svg"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Pinned upstream release. `system-fonts` is deliberately off: this library only
# ever sees font bytes its caller supplies, and never reads a font itself.
resvg = { version = "=0.49.0", default-features = false, features = ["text", "raster-images"] }
usvg = { version = "=0.49.0", default-features = false, features = ["text"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
