name: gitpulse
description: "GitPulse native Release Timeline client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.8

dependencies:
  cookie_jar: ^4.0.9
  crypto: ^3.0.7
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  # Pinned, not floated: 6.1.5 is the last stable release and its Android
  # package still calls getDefaultProguardFile('proguard-android.txt'), which
  # AGP 9 rejects at configuration time. 6.2.0-beta.3 is the release that
  # switched to proguard-android-optimize.txt and compileSdk from Flutter.
  # See docs/research/flutter-document-webview.md.
  flutter_inappwebview: 6.2.0-beta.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  html: ^0.15.7
  intl: ^0.20.3
  json_annotation: ^4.12.0
  marionette_flutter: ^0.7.0
  markdown: ^7.3.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.0
  drift_dev: ^2.35.2
  json_serializable: ^6.15.2
  build_runner: ^2.16.2
  flutter_launcher_icons: 0.14.4
  image: ^4.12.0
  xml: ^7.0.1
  yaml: ^3.1.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    # The document renderer: built by tool/document_viewer and committed, so a
    # checkout needs no JavaScript toolchain.
    - assets/document_viewer/
