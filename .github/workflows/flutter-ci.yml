name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Flutter format, analyze and tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun for the real Nitro contract fixtures
        uses: oven-sh/setup-bun@v2

      - name: Install backend dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: flutter/pubspec.yaml
          cache: true

      - name: Resolve the committed dependency graph
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run feature and regression tests
        run: flutter test --no-pub --reporter expanded
